name: Build Mod in Cloud

on:
  repository_dispatch:
    types: [build_mod]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 

    steps:
      - name: 准备项目目录并解析版本号
        id: prep
        run: |
          mkdir -p /home/runner/mod_workspace
          cd /home/runner/mod_workspace
          echo "${{ github.event.client_payload.project_zip_base64 }}" | base64 -d > project.zip
          unzip project.zip
          rm project.zip
          
          # 动态读取 wrapper 配置里的版本号，比如 8.8、8.10
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9\.]*\)-bin.zip.*/\1/')
            echo "提取到 Gradle 版本: $VER"
            echo "GRADLE_VER=$VER" >> $GITHUB_ENV
          else
            echo "未找到 wrapper，使用默认 8.8"
            echo "GRADLE_VER=8.8" >> $GITHUB_ENV
          fi

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 关键：这里使用上一步提取出的动态版本号
      - name: 动态设置 Gradle 环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VER }}

      - name: 执行 Gradle 构建
        run: |
          cd /home/runner/mod_workspace
          gradle build

      - name: 回传 Jar 到 PHP
        if: success()
        run: |
          cd /home/runner/mod_workspace
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then exit 1; fi
          curl -X POST "${{ github.event.client_payload.callback_url }}&status=success" \
               -F "task_id=${{ github.event.client_payload.task_id }}" \
               -F "jar_file=@$JAR_PATH"

      - name: 失败时通知 PHP
        if: failure()
        run: |
          # 使用 GET 传递失败状态，避免 POST 被 WAF 或防火墙拦截产生 52 错误
          curl -s -G "${{ github.event.client_payload.callback_url }}&status=failed&task_id=${{ github.event.client_payload.task_id }}" || true