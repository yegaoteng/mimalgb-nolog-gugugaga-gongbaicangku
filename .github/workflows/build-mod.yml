name: Build Mod in Cloud

on:
  repository_dispatch:
    types: [build_mod]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 

    steps:
      - name: 准备项目目录并解析源码
        id: prep
        env:
          # 接收 Base64 编码的数据，防止代码里包含特殊字符破坏脚本
          PROJECT_JSON_B64: ${{ github.event.client_payload.project_json_b64 }}
        run: |
          mkdir -p /home/runner/mod_workspace
          cd /home/runner/mod_workspace
          set +e
          
          # 1. 安全地解析 Base64 还原 JSON 文件
          echo "$PROJECT_JSON_B64" | base64 -d > project.json
          
          # 2. 关键防御：过滤掉格式非法的文件
          node -e '
            const fs = require("fs");
            const path = require("path");
            try {
              const files = JSON.parse(fs.readFileSync("project.json", "utf8"));
              for (const file of files) {
                if (!file.path || typeof file.path !== "string") {
                  console.warn("⚠️ 忽略非法文件（缺少 path）:", file);
                  continue;
                }
                const dir = path.dirname(file.path);
                if (dir !== ".") fs.mkdirSync(dir, { recursive: true });
                fs.writeFileSync(file.path, file.content || "");
              }
            } catch(e) {
              console.error("❌ 解析 JSON 报错:", e.message);
              process.exit(1);
            }
          ' > build_log.txt 2>&1
          
          if [ $? -ne 0 ]; then
            echo "构建在文件还原阶段失败！" >> build_log.txt
            cat build_log.txt
            exit 1
          fi
          
          rm -f project.json build_log.txt
          set -e
          
          # 3. 解析 Gradle 和 Java 版本
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9\.]*\)-bin.zip.*/\1/')
            echo "GRADLE_VER=$VER" >> $GITHUB_ENV
          else
            echo "GRADLE_VER=8.8" >> $GITHUB_ENV
          fi
          
          if [ -f "gradle.properties" ]; then
            MC_VER=$(grep minecraft_version gradle.properties | cut -d'=' -f2 | xargs)
            if [[ "$MC_VER" == "1.20.5"* || "$MC_VER" == "1.20.6"* || "$MC_VER" == "1.21"* ]]; then
              echo "JAVA_VER=21" >> $GITHUB_ENV
            else
              echo "JAVA_VER=17" >> $GITHUB_ENV
            fi
          else
            echo "JAVA_VER=17" >> $GITHUB_ENV
          fi

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VER }}

      - name: 动态设置 Gradle 环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VER }}

      - name: 执行 Gradle 构建
        id: build_step
        run: |
          cd /home/runner/mod_workspace
          set +e
          gradle build > build_log.txt 2>&1
          BUILD_EXIT_CODE=$?
          set -e
          
          cat build_log.txt
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            exit 1
          fi

      - name: 回传 Jar 到 Cloudflare
        if: success()
        run: |
          cd /home/runner/mod_workspace
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then exit 1; fi
          curl -s -X POST "${{ github.event.client_payload.callback_url }}" \
               -F "status=success" \
               -F "task_id=${{ github.event.client_payload.task_id }}" \
               -F "jar_file=@$JAR_PATH"

      - name: 失败时通知 Cloudflare
        if: failure()
        run: |
          cd /home/runner/mod_workspace
          if [ -f build_log.txt ]; then
            LOG_CONTENT=$(tail -c 2000 build_log.txt)
          else
            LOG_CONTENT="构建在极早期失败。"
          fi
          
          curl -s -X POST "${{ github.event.client_payload.callback_url }}" \
               -F "status=failed" \
               -F "task_id=${{ github.event.client_payload.task_id }}" \
               -F "error_log=$LOG_CONTENT" || true