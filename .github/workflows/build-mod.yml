name: Build Mod in Cloud

on:
  repository_dispatch:
    types: [build_mod]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 设置超时，防止死循环

    steps:
      - name: 准备项目目录
        run: |
          mkdir -p /home/runner/mod_workspace
          cd /home/runner/mod_workspace
          # 解码 PHP 传来的 Base64 源码
          echo "${{ github.event.client_payload.project_zip_base64 }}" | base64 -d > project.zip
          unzip project.zip
          rm project.zip

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 缓存 Gradle 依赖，极大加速二次构建
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: 执行 Gradle 构建
        run: |
          cd /home/runner/mod_workspace
          chmod +x gradlew
          # 开启强制国内镜像加速
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2G"
          ./gradlew build

      - name: 回传 Jar 到 PHP
        if: success()
        run: |
          cd /home/runner/mod_workspace
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "构建失败，未找到 Jar。"
            exit 1
          fi
          echo "找到 Jar: $JAR_PATH"
          
          # 发送回调请求给 PHP
          curl -X POST "${{ github.event.client_payload.callback_url }}" \
               -F "task_id=${{ github.event.client_payload.task_id }}" \
               -F "jar_file=@$JAR_PATH"