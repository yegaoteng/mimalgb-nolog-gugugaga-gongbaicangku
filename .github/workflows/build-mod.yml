name: Build Mod in Cloud

on:
  repository_dispatch:
    types: [build_mod]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 

    steps:
      - name: 准备项目目录
        run: |
          mkdir -p /home/runner/mod_workspace
          cd /home/runner/mod_workspace
          echo "${{ github.event.client_payload.project_zip_base64 }}" | base64 -d > project.zip
          unzip project.zip
          rm project.zip

      - name: 设置 Java 17 (目前 1.21 也用 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 动态加载：直接读取项目自带的 wrapper 配置去下载对应的 Gradle
      - name: 执行 Gradle 构建
        run: |
          cd /home/runner/mod_workspace
          # 如果没有 gradlew，则利用项目里的 properties 配置自动生成一个
          if [ ! -f "gradlew" ]; then
            echo "生成 wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build

      - name: 回传 Jar 到 PHP
        if: success()
        run: |
          cd /home/runner/mod_workspace
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then exit 1; fi
          curl -X POST "${{ github.event.client_payload.callback_url }}&status=success" \
               -F "task_id=${{ github.event.client_payload.task_id }}" \
               -F "jar_file=@$JAR_PATH"

      - name: 失败时通知 PHP
        if: failure()
        run: |
          curl -X POST "${{ github.event.client_payload.callback_url }}&status=failed" \
               -F "task_id=${{ github.event.client_payload.task_id }}"